
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      FILES_INPUT_DIR: "/files/input"
      FILES_OUTPUT_DIR: "/files/output"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./files:/files
  
  frontend:
    build:
      context: ./frontend/apps/web
      dockerfile: Dockerfile.dev
    container_name: dictionary-translator-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8081
    depends_on:
      - backend
    restart: unless-stopped


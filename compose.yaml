
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      FILES_INPUT_DIR: "/files/input"
      FILES_OUTPUT_DIR: "/files/output"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./files:/files

name: adjusted-bible-concordance-dev

services:
  backend:
    container_name: adjusted-bible-concordance-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      FILES_INPUT_DIR: "/files/input"
      FILES_OUTPUT_DIR: "/files/output"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./files:/files
      - adjusted-bible-concordance_backend_modules:/go/pkg/mod
      - adjusted-bible-concordance_backend_build:/root/.cache/go-build
    restart: unless-stopped

  frontend:
    container_name: adjusted-bible-concordance-frontend
    build:
      context: ./frontend/apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_API_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/apps/web:/app
      - adjusted-bible-concordance_frontend_modules:/app/node_modules
      - adjusted-bible-concordance_frontend_next_build:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  adjusted-bible-concordance_backend_modules:
    name: adjusted-bible-concordance_backend_modules

  adjusted-bible-concordance_backend_build:
    name: adjusted-bible-concordance_backend_build

  adjusted-bible-concordance_frontend_modules:
    name: adjusted-bible-concordance_frontend_modules

  adjusted-bible-concordance_frontend_next_build:
    name: adjusted-bible-concordance_frontend_next_build
